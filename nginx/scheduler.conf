server {
    listen 80;
    server_name dillema.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dillema.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/dillema.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dillema.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Serve React frontend
    location / {
        root /var/www/dillema/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy all API requests to FastAPI
    location /api {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SSE endpoint — must be separate block, buffering must be off
    location /api/events {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   Connection '';
        proxy_buffering            off;
        proxy_cache                off;
        proxy_read_timeout         86400s;
        chunked_transfer_encoding  on;
        add_header                 X-Accel-Buffering no;
    }

    # Swagger UI
    location /docs {
        proxy_pass       http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # OpenAPI JSON schema
    location /openapi.json {
        proxy_pass       http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # Gzip for static assets
    gzip            on;
    gzip_types      text/plain text/css application/json
                    application/javascript text/xml
                    application/xml text/javascript;
    gzip_min_length 1000;
}